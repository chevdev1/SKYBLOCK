<!doctype html>
<html><head><meta charset="utf-8"><title>Post 01: Meet Hop to Olympus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Pixelify+Sans:wght@600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#141a3c;--gold:#ffc23c;--pink:#ff5d8a}
html,body{margin:0;background:#000}
#c{position:relative;width:1600px;height:900px;overflow:hidden;background:#6aa8e8 url(bg-game-start.jpg) center/cover no-repeat;font-family:'Nunito',sans-serif}
#c::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,26,60,.82) 0,rgba(20,26,60,.55) 34%,rgba(20,26,60,0) 62%)}
#c::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(20,26,60,.28) 100%)}
.in{position:absolute;left:84px;top:70px;width:760px;z-index:2;color:#fff}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:74px;width:auto;filter:drop-shadow(0 4px 0 rgba(10,12,36,.5))}
.brand span{font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:34px;text-shadow:0 4px 0 var(--ink)}
.brand b{color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:12px;margin-top:34px;padding:13px 18px;background:var(--gold);color:var(--ink);border:5px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);font-family:'Press Start 2P',monospace;font-size:19px;line-height:1}
.tag i{width:14px;height:14px;border-radius:50%;background:#2fbf4a;box-shadow:0 0 0 4px rgba(47,191,74,.35)}
h1{margin:30px 0 0;font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:128px;line-height:.94;letter-spacing:0;color:#fff;text-shadow:-4px -4px 0 var(--ink),4px -4px 0 var(--ink),-4px 4px 0 var(--ink),4px 4px 0 var(--ink),0 11px 0 var(--ink)}
h1 b{color:var(--gold);font-weight:700}
.sub{display:inline-block;margin-top:30px;padding:14px 20px;background:var(--ink);border-radius:9px;box-shadow:6px 6px 0 rgba(10,12,36,.4);font-weight:900;font-size:33px;line-height:1.28}
.sub em{font-style:normal;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.chips span{padding:10px 16px;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--ink);font-weight:900;font-size:24px}
.foot{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 84px;height:92px;background:linear-gradient(180deg,rgba(20,26,60,0),rgba(20,26,60,.78))}
.foot .l{font-family:'Press Start 2P',monospace;font-size:17px;color:var(--gold);text-shadow:0 3px 0 var(--ink)}
.foot .r{font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 rgba(10,12,36,.8)}
</style></head><body>
<div id="c"><div class="in">
  <div class="brand"><img src="kumo-logo-256.png" alt=""><span>Hop to <b>Olympus</b></span></div>
  <div class="tag"><i></i><span id="tag"></span></div>
  <h1 id="h"></h1>
  <div class="sub" id="s"></div>
  <div class="chips" id="ch"></div>
</div>
<div class="foot"><span class="l" id="fl"></span><span class="r" id="fr"></span></div></div>
<script>
const L = new URLSearchParams(location.search).get('lang') === 'ru' ? 'ru' : 'en';
const C = {
  en: { tag: 'ALPHA TEST · OPENING SOON', h: 'MEET<br><b>OLYMPUS</b>', s: 'A voxel action RPG <em>in your browser.</em>', ch: ['6 worlds', '33 bosses', 'Co-op', 'Raise a Kumo'], fl: 'NO DOWNLOAD · NO SIGN-UP', fr: 'Follow to hear first' },
  ru: { tag: 'АЛЬФА-ТЕСТ · СКОРО ОТКРОЕМ', h: 'ЗНАКОМЬСЯ:<br><b>ОЛИМП</b>', s: 'Воксельная экшн-RPG <em>прямо в браузере.</em>', ch: ['6 миров', '33 босса', 'Кооп', 'Расти Кумо'], fl: 'БЕЗ УСТАНОВКИ · БЕЗ РЕГИСТРАЦИИ', fr: 'Подпишись, чтобы узнать первым' },
}[L];
document.getElementById('tag').textContent = C.tag; document.getElementById('h').innerHTML = C.h; document.getElementById('s').innerHTML = C.s;
document.getElementById('ch').innerHTML = C.ch.map(x => '<span>' + x + '</span>').join(''); document.getElementById('fl').textContent = C.fl; document.getElementById('fr').textContent = C.fr;
document.fonts.ready.then(() => { window.__ready = true });
</script></body></html>
