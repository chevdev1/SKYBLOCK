<!doctype html>
<html><head><meta charset="utf-8"><title>Kumo forms (transparent renders)</title></head><body style="margin:0;background:#222">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../../landing/voxel.js"></script>
<script src="../../src/scene.js"></script>
<script>
/* renders every Kumo stage/form to a transparent PNG data URL, collected in window.__out */
const F = [
  ['egg',    { stage: 0 }],
  ['baby',   { stage: 1 }],
  ['teen',   { stage: 2, parts: ['bunny'] }],
  ['meadow', { stage: 3, form: 'lug' }],
  ['thunder',{ stage: 3, form: 'grom' }],
  ['twilight',{ stage: 3, form: 'sum' }],
  ['starry', { stage: 3, form: 'zv' }],
  ['rainbow',{ stage: 3, form: 'rain' }],
  ['rare',   { stage: 2, parts: ['bunny'], rare: true, noGlow: true }],
];
window.__out = {};
F.forEach(([name, k]) => {
  const res = KSCENE.render(document.createElement('canvas'), { w: 700, h: 820, dpr: 1.4, cute: true, cam: { fov: 24, pos: [0.5, 2.1, 8.6], look: [0, 1.15, 0] }, hemi: 0.88, sun: 0.65, ground: 0xe6a8cc, rimColor: 0xffffff, rim: 0.4,
    kumos: [Object.assign({ scale: 1.35, ry: -0.34 }, k)] });
  window.__out[name] = res.url;
});
window.__ready = true;
</script></body></html>
