<!doctype html>
<html><head><meta charset="utf-8"><title>Hop to Olympus banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Pixelify+Sans:wght@600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000}
#b{position:relative;width:1500px;height:500px;overflow:hidden;background:radial-gradient(ellipse at 76% 30%,#7a46d8 0,#4a2f9e 28%,#262270 56%,#141a3c 100%)}
#b .rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 80% 118%,rgba(255,194,60,.12) 0 6deg,transparent 6deg 16deg);-webkit-mask:radial-gradient(circle at 80% 118%,#000 0,transparent 80%);mask:radial-gradient(circle at 80% 118%,#000 0,transparent 80%)}
#b img.k{position:absolute;right:0;top:0;width:900px;height:500px}
#b .floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,#f4f8ff,#cfdcf2)}
.sp{position:absolute;background:#fff}
.t{position:absolute;left:122px;top:84px;color:#fff}
.t .a{display:inline-flex;align-items:center;gap:10px;padding:9px 12px;background:#ffc23c;color:#141a3c;border:4px solid #141a3c;border-radius:8px;box-shadow:5px 5px 0 #141a3c;font-family:'Press Start 2P',monospace;font-size:14px}
.t .a i{width:10px;height:10px;border-radius:50%;background:#2fbf4a;box-shadow:0 0 0 3px rgba(47,191,74,.3)}
.t .h1{margin-top:26px;font-family:'Press Start 2P',monospace;font-size:26px;color:#ffc23c;letter-spacing:4px;text-shadow:0 4px 0 #141a3c}
.t .h2{margin-top:10px;font-family:'Pixelify Sans',sans-serif;font-weight:700;font-size:140px;line-height:.9;letter-spacing:2px;text-shadow:-5px -5px 0 #141a3c,5px -5px 0 #141a3c,-5px 5px 0 #141a3c,5px 5px 0 #141a3c,0 11px 0 #141a3c}
.t .s{margin-top:24px;font-family:'Nunito',sans-serif;font-weight:900;font-size:28px;text-shadow:0 3px 0 rgba(20,26,60,.8)}
.t .s b{color:#ffc23c}
</style></head><body>
<div id="b"><div class="rays"></div><div id="deco"></div><img class="k" id="k" alt="">
<div class="t"><span class="a"><i></i>OPEN ALPHA</span><div class="h1">HOP TO</div><div class="h2">OLYMPUS</div><div class="s">Climb the clouds. Raise your <b>Kumo</b>.</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../landing/voxel.js"></script>
<script src="scene.js"></script>
<script>
const W = 900, H = 500;
const cv = document.createElement('canvas');
/* five Kumo forms climbing floating clouds: baby -> bunny -> star -> lug -> ultra-rare hero */
const forms = [
  { stage: 1, parts: [], sc: 1.1 },
  { stage: 2, parts: ['bunny'], sc: 1.1 },
  { stage: 3, form: 'zv', sc: 1.12 },
  { stage: 3, form: 'lug', sc: 1.16 },
  { stage: 2, parts: ['bunny'], rare: true, noGlow: true, noHalo: true, sc: 1.55 },
];
const X = [-4.9, -2.5, -0.1, 2.3, 4.9], Y = [0.0, 0.62, 1.24, 1.86, 2.5];
const kumos = forms.map((f, i) => Object.assign({ pos: [X[i], Y[i], 0], scale: f.sc, ry: -0.5 + (i % 2) * 0.14, t: 0.4 }, f));
const res = KSCENE.render(cv, {
  w: W, h: H, dpr: 2, cam: { fov: 27, pos: [0.5, 3.6, 14.2], look: [0.3, 2.72, 0] }, hemi: 0.66, sun: 0.85, ground: 0x6a58b8, rimColor: 0xff9ad0, rim: 0.55, kumos,
  extra: [(s, T) => {
    const L = (c) => new T.MeshLambertMaterial({ color: c });
    const box = (w, h, d, c, x, y, z) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), L(c)); m.position.set(x, y, z); s.add(m); return m };
    for (let i = 0; i < 5; i++) {
      const w = i === 4 ? 3.0 : 2.1, x = X[i], top = Y[i];
      box(w, 0.5, 1.9, 0xf8fbff, x, top - 0.25, 0);
      box(w - 0.5, 0.4, 1.6, 0xdfe8fa, x + 0.1, top - 0.7, 0);
      box(w - 1.1, 0.3, 1.2, 0xc6d4f2, x - 0.05, top - 1.05, 0);
      box(0.8, 0.34, 0.9, 0xffffff, x - w / 2 + 0.1, top - 0.13, 0.7);
      box(0.6, 0.28, 0.7, 0xffffff, x + w / 2 - 0.2, top - 0.1, -0.5);
    }
    /* small floating puffs for depth */
    [[-6.6, 2.6, -1.5], [7.0, 0.4, -2], [2.2, 4.9, -3], [-3.4, 4.6, -3]].forEach(([x, y, z]) => { box(1.3, 0.38, 1.0, 0xe9f0ff, x, y, z); box(0.8, 0.3, 0.8, 0xffffff, x + 0.2, y + 0.3, z) });
    /* gold halo on the hero: ears top is at pos.y + 1.82 * scale */
    const hy = Y[4] + 1.82 * 1.55 + 0.2;
    const hal = new T.Mesh(new T.TorusGeometry(0.85, 0.1, 12, 48), new T.MeshPhongMaterial({ color: 0xffc23c, emissive: 0xff9d00, emissiveIntensity: 0.55, shininess: 90 }));
    hal.rotation.x = Math.PI / 2 - 0.22; hal.position.set(X[4] + 0.04, hy, 0); s.add(hal);
    const g = new T.Mesh(new T.TorusGeometry(0.85, 0.26, 8, 48), new T.MeshBasicMaterial({ color: 0xffc23c, transparent: true, opacity: 0.22, blending: T.AdditiveBlending, depthWrite: false })); g.rotation.copy(hal.rotation); g.position.copy(hal.position); s.add(g);
  }],
});
document.getElementById('k').src = res.url;
const star = (x, y, z, o) => '<div class="sp" style="left:' + (x - z / 2) + 'px;top:' + (y - z * 1.5) + 'px;width:' + z + 'px;height:' + z * 3 + 'px;opacity:' + o + '"></div><div class="sp" style="left:' + (x - z * 1.5) + 'px;top:' + (y - z / 2) + 'px;width:' + z * 3 + 'px;height:' + z + 'px;opacity:' + o + '"></div>';
document.getElementById('deco').innerHTML = [[70,50,5,.5],[640,38,6,.55],[930,70,5,.45],[1190,40,7,.6],[1420,110,5,.5],[1330,26,4,.5],[780,150,4,.4],[560,210,4,.35]].map(a => star(...a)).join('');
document.fonts.ready.then(() => { window.__ready = true });
</script></body></html>
