<!doctype html>
<html><head><meta charset="utf-8"><title>Hop to Olympus banner: floating island</title>
<style>
html,body{margin:0;background:#000}
#b{position:relative;width:1500px;height:500px;overflow:hidden;background:linear-gradient(180deg,#f48fba 0%,#ffa9c4 34%,#ffc9bd 62%,#ffe9c2 100%)}
#b .sun{position:absolute;inset:0;background:radial-gradient(ellipse 34% 70% at 66% 38%,rgba(255,255,255,.75),rgba(255,236,200,.25) 55%,transparent 75%)}
#b img.k{position:absolute;inset:0;width:100%;height:100%}
#b .haze{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,rgba(255,244,214,.55))}
</style></head><body>
<div id="b"><div class="sun"></div><img class="k" id="k" alt=""><div class="haze"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../landing/voxel.js"></script>
<script src="scene.js"></script>
<script>
const q = new URLSearchParams(location.search);
const res = KSCENE.render(document.createElement('canvas'), {
  w: 1500, h: 500, dpr: +(q.get('dpr') || 1), hemi: 0.95, sun: 0.85, ground: 0xe6b8d0, rimColor: 0xffe0b0, rim: 0.4,
  cam: { fov: 30, pos: [0, 8, 38], look: [1.5, 3.7, 0] }, kumos: [],
  extra: [(s, T) => {
    const place = (g, x, y, z, sc, ry) => { g.position.set(x, y, z); g.scale.setScalar(sc); g.rotation.y = ry; s.add(g); return g };
    /* far clouds behind everything */
    const far = VX.clouds(8, 60, 1, 10, 13); far.position.set(0, 0, -50); s.add(far);
    /* small islands, then the hero island with trees, hut and mushrooms */
    place(VX.island('islands', 3.5, { deco: false }), -21, 3.2, -9, 1.0, 0.7);
    place(VX.island('islands', 3, { deco: false }), 24, 2.4, -7, 1.0, -0.5);
    place(VX.island('islands', 5), 2.2, 0, 0, 1.5, 0.62);
    /* cloud sea below, hiding the bottoms of the islands */
    const sea = VX.clouds(14, 60, -10.5, -6.8, 5); sea.position.set(0, 0, -5); s.add(sea);
    const sea2 = VX.clouds(10, 70, -9.5, -5.8, 21); sea2.position.set(4, 0, -24); s.add(sea2);
  }],
});
document.getElementById('k').src = res.url;
window.__ready = true;
</script></body></html>
