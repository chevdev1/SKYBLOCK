<!doctype html>
<html><head><meta charset="utf-8"><title>Kumo avatar (cute)</title>
<style>
html,body{margin:0;background:#000}
#a{position:relative;width:1024px;height:1024px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#ffe9d2 0,#ffc4d6 46%,#f58db4 100%)}
#a.clear{background:transparent}
#a.clear .sd{display:none}
#a.sky{background:radial-gradient(circle at 50% 42%,#f2fbff 0,#bfe3ff 48%,#7fb6ff 100%)}
#a img.k{position:absolute;inset:0;width:100%;height:100%}
.sd{position:absolute;left:27%;width:46%;top:78.5%;height:7%;background:radial-gradient(ellipse,rgba(150,60,110,.42),transparent 70%)}
#a.sky .sd{background:radial-gradient(ellipse,rgba(40,80,170,.38),transparent 70%)}
</style></head><body>
<div id="a"><div class="sd"></div><img class="k" id="k" alt=""></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../landing/voxel.js"></script>
<script src="scene.js"></script>
<script>
const q = new URLSearchParams(location.search), halo = q.get('halo') === '1', theme = q.get('t') || 'pink';
document.getElementById('a').className = theme;
const S = 1.5;
const res = KSCENE.render(document.createElement('canvas'), {
  w: 1024, h: 1024, dpr: 1.5, cute: true, cam: { fov: 22, pos: [0.45, 2.5, halo ? 10.0 : 9.0], look: [0, halo ? 1.5 : 1.28, 0] },
  hemi: 0.88, sun: 0.62, ground: theme === 'sky' ? 0xa8c4f0 : 0xe6a8cc, rimColor: 0xffffff, rim: 0.4,
  kumos: [{ stage: 2, parts: ['bunny'], scale: S, pos: [0, 0, 0], ry: -0.34 }],
  extra: halo ? [(s, T) => {
    const m = new T.Mesh(new T.TorusGeometry(0.62, 0.07, 12, 48), new T.MeshPhongMaterial({ color: 0xffc23c, emissive: 0xff9d00, emissiveIntensity: 0.5, shininess: 90 }));
    m.rotation.x = Math.PI / 2 - 0.2; m.position.set(0.02, 1.82 * S + 0.12, 0); s.add(m);
  }] : [],
});
document.getElementById('k').src = res.url; window.__url = res.url;
window.__ready = true;
</script></body></html>
