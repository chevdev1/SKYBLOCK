<!doctype html>
<html><head><meta charset="utf-8"><title>Kumo avatar</title>
<style>
html,body{margin:0;background:#000}
#a{position:relative;width:1024px;height:1024px;overflow:hidden}
#a .bg,#a .rays,#a .vig{position:absolute;inset:0}
#a img.k{position:absolute;inset:0;width:100%;height:100%}
#a.night .bg{background:radial-gradient(circle at 50% 44%,#6a3fd0 0,#3a2a9a 30%,#1c1f5e 62%,#0f1334 100%)}
#a.night .rays{background:repeating-conic-gradient(from 0deg at 50% 44%,rgba(255,194,60,.16) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle at 50% 44%,#000 0,transparent 70%);mask:radial-gradient(circle at 50% 44%,#000 0,transparent 70%)}
#a.gold .bg{background:radial-gradient(circle at 50% 46%,#fff0b0 0,#ffd04a 36%,#ff9d3c 78%,#ff6f6f 100%)}
#a.gold .rays{background:repeating-conic-gradient(from 8deg at 50% 46%,rgba(255,255,255,.34) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(circle at 50% 46%,#000 0,transparent 78%);mask:radial-gradient(circle at 50% 46%,#000 0,transparent 78%)}
#a.sky .bg{background:linear-gradient(180deg,#5aa8ff 0,#9fd0ff 52%,#ffe0e8 100%)}
#a.sky .rays{background:repeating-conic-gradient(from 4deg at 50% 46%,rgba(255,255,255,.28) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle at 50% 46%,#000 0,transparent 75%);mask:radial-gradient(circle at 50% 46%,#000 0,transparent 75%)}
#a .vig{background:radial-gradient(circle at 50% 50%,transparent 58%,rgba(10,12,36,.35) 100%);pointer-events:none}
#a.gold .vig{background:radial-gradient(circle at 50% 50%,transparent 62%,rgba(160,60,20,.28) 100%)}
.sd{position:absolute;left:24%;width:52%;top:80.5%;height:8%;background:radial-gradient(ellipse,rgba(10,12,36,.5),transparent 70%)}
#a.gold .sd{background:radial-gradient(ellipse,rgba(150,50,20,.4),transparent 70%)}
.cl{position:absolute;background:#fff;opacity:.95}
.sp{position:absolute;background:#fff}
</style></head><body>
<div id="a"><div class="bg"></div><div class="rays"></div><div id="deco"></div><div class="sd"></div><img class="k" id="k" alt=""><div class="vig"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../landing/voxel.js"></script>
<script src="scene.js"></script>
<script>
const theme = new URLSearchParams(location.search).get('t') || 'night';
const A = document.getElementById('a'); A.className = theme;
const haloCol = theme === 'gold' ? 0xff5d8a : 0xffc23c, haloEm = theme === 'gold' ? 0xc02060 : 0xff9d00;
const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024;
const res = KSCENE.render(cv, {
  w: 1024, h: 1024, dpr: 1.5, cam: { fov: 24, pos: [0.9, 2.0, 9.4], look: [0, 1.38, 0] }, hemi: 0.62, sun: 0.82, ground: theme === 'gold' ? 0xc88a5a : theme === 'sky' ? 0x7a96e0 : 0x6a58b8, rimColor: theme === 'gold' ? 0xffffff : 0xff9ad0, rim: 0.55,
  kumos: [{ stage: 2, parts: ['bunny'], scale: 1.32, pos: [0, 0, 0], ry: -0.3 }],
  extra: [(s, T) => {
    const m = new T.Mesh(new T.TorusGeometry(0.72, 0.09, 12, 48), new T.MeshPhongMaterial({ color: haloCol, emissive: haloEm, emissiveIntensity: 0.55, shininess: 90 }));
    m.rotation.x = Math.PI / 2 - 0.22; m.rotation.z = 0.06; m.position.set(0.03, 2.5, 0); s.add(m);
    const g = new T.Mesh(new T.TorusGeometry(0.72, 0.22, 8, 48), new T.MeshBasicMaterial({ color: haloCol, transparent: true, opacity: 0.22, blending: T.AdditiveBlending, depthWrite: false }));
    g.rotation.copy(m.rotation); g.position.copy(m.position); s.add(g);
  }],
});
document.getElementById('k').src = res.url;
const deco = document.getElementById('deco'); let h = '';
const star = (x, y, z, c, o) => '<div class="sp" style="left:' + (x - z / 2) + 'px;top:' + (y - z * 1.5) + 'px;width:' + z + 'px;height:' + z * 3 + 'px;background:' + c + ';opacity:' + o + '"></div><div class="sp" style="left:' + (x - z * 1.5) + 'px;top:' + (y - z / 2) + 'px;width:' + z * 3 + 'px;height:' + z + 'px;background:' + c + ';opacity:' + o + '"></div>';
const sc = theme === 'gold' ? '#ffffff' : '#ffe08a';
[[170,210,10],[860,190,14],[130,640,8],[900,610,10],[260,860,8],[790,880,12],[520,90,9]].forEach(([x, y, z]) => h += star(x, y, z, sc, .85));
if (theme === 'sky') { [[60,820,260,60],[700,880,300,70],[820,120,200,50],[40,180,180,44]].forEach(([x,y,w,hh]) => h += '<div class="cl" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + hh + 'px"></div><div class="cl" style="left:' + (x + w * .15) + 'px;top:' + (y - hh * .6) + 'px;width:' + w * .5 + 'px;height:' + hh * .7 + 'px"></div>') }
deco.innerHTML = h;
window.__ready = true;
</script></body></html>
